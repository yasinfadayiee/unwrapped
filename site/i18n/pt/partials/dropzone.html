<div class="fade-in" style="--d:.5s">
<div class="drop" id="start">
  <div class="drop-inner" data-drop aria-label="Analise sua exportação de dados">
    <div class="drop-icon"><svg aria-hidden="true"><use href="#i-package"/></svg></div>
    <div class="drop-title">Solte aqui o ZIP da sua exportação</div>
    <p class="drop-hint">É lido neste aparelho — nada é enviado.</p>
    <div class="drop-actions">
      <button class="btn btn--primary btn--lg" type="button" data-pick><svg aria-hidden="true"><use href="#i-upload"/></svg>Escolher minha exportação</button>
      <a class="btn btn--ghost btn--lg" href="#how"><svg aria-hidden="true"><use href="#i-download"/></svg>Ainda não tenho</a>
    </div>
    <div class="drop-platforms" aria-label="Plataformas compatíveis">
      <span class="pf"><img class="ico3d" src="/assets/img/icons/instagram.webp" width="64" height="64" alt="" decoding="async">Instagram</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/tiktok.webp" width="64" height="64" alt="" decoding="async">TikTok</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/x.webp" width="64" height="64" alt="" decoding="async">X</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/facebook.webp" width="64" height="64" alt="" decoding="async">Facebook</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/threads.webp" width="64" height="64" alt="" decoding="async">Threads</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/linkedin.webp" width="64" height="64" alt="" decoding="async">LinkedIn</span>
    </div>
    <div class="drop-links"><button class="link-arrow small" type="button" data-demo>Ver a demo ao vivo</button><span aria-hidden="true">·</span><button class="link-arrow small" type="button" data-pick-folder>Escolha uma pasta descompactada</button></div>
    <input class="drop-file" type="file" multiple accept=".zip,.json,.html,.htm,.js,.txt,.csv,application/zip" tabindex="-1" aria-hidden="true">
    <input class="drop-file" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
  </div>
</div>
</div>
<div class="trust-row fade-in" style="--d:.7s">
  <span><svg aria-hidden="true"><use href="#i-shield"/></svg>0 bytes enviados</span>
  <span><svg aria-hidden="true"><use href="#i-plane"/></svg>Funciona no modo avião</span>
  <span><svg aria-hidden="true"><use href="#i-key"/></svg>Nunca pede sua senha</span>
  <span><svg aria-hidden="true"><use href="#i-bolt"/></svg>100.000 seguidores em menos de 2 segundos</span>
</div>
