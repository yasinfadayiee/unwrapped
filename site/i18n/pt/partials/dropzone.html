<div class="fade-in" style="--d:.5s">
<div class="drop" id="start">
  <div class="drop-inner" data-drop aria-label="Analise sua exportação de dados">
    <div class="drop-icon"><svg aria-hidden="true"><use href="#i-package"/></svg></div>
    <div class="drop-title">Solte aqui o ZIP da sua exportação</div>
    <p class="drop-hint">Um ZIP, várias partes ZIP, uma pasta descompactada ou arquivos JSON / HTML / TXT. Nunca sai deste aparelho.</p>
    <div class="drop-actions">
      <button class="btn btn--primary btn--lg" type="button" data-pick><svg aria-hidden="true"><use href="#i-upload"/></svg>Escolher minha exportação</button>
      <button class="btn btn--ghost btn--lg" type="button" data-demo><svg aria-hidden="true"><use href="#i-play"/></svg>Ver a demo ao vivo</button>
    </div>
    <div class="drop-platforms" aria-label="Plataformas compatíveis">
      <span class="pf"><svg aria-hidden="true"><use href="#i-instagram"/></svg>Instagram</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-tiktok"/></svg>TikTok</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-x"/></svg>X</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-facebook"/></svg>Facebook</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-threads"/></svg>Threads</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-linkedin"/></svg>LinkedIn</span>
    </div>
    <button class="link-arrow small" type="button" data-pick-folder>ou escolha uma pasta descompactada</button>
    <input class="drop-file" type="file" multiple accept=".zip,.json,.html,.htm,.js,.txt,.csv,application/zip" tabindex="-1" aria-hidden="true">
    <input class="drop-file" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
  </div>
</div>
</div>
<div class="trust-row fade-in" style="--d:.7s">
  <span><svg aria-hidden="true"><use href="#i-shield"/></svg>0 bytes enviados</span>
  <span><svg aria-hidden="true"><use href="#i-plane"/></svg>Funciona no modo avião</span>
  <span><svg aria-hidden="true"><use href="#i-key"/></svg>Nunca pede sua senha</span>
  <span><svg aria-hidden="true"><use href="#i-bolt"/></svg>100.000 seguidores em menos de 2 segundos</span>
</div>
