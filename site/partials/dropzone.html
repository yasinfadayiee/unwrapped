<div class="fade-in" style="--d:.5s">
<div class="drop" id="start">
  <div class="drop-inner" data-drop aria-label="Analyze your data export">
    <div class="drop-icon"><svg aria-hidden="true"><use href="#i-package"/></svg></div>
    <div class="drop-title">Drop your export ZIP here</div>
    <p class="drop-hint">It’s read on this device — nothing is uploaded.</p>
    <div class="drop-actions">
      <button class="btn btn--primary btn--lg" type="button" data-pick><svg aria-hidden="true"><use href="#i-upload"/></svg>Choose my export</button>
      <a class="btn btn--ghost btn--lg" href="#how"><svg aria-hidden="true"><use href="#i-download"/></svg>I don’t have it yet</a>
    </div>
    <div class="drop-platforms" aria-label="Supported platforms">
      <span class="pf"><svg aria-hidden="true"><use href="#i-instagram"/></svg>Instagram</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-tiktok"/></svg>TikTok</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-x"/></svg>X</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-facebook"/></svg>Facebook</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-threads"/></svg>Threads</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-linkedin"/></svg>LinkedIn</span>
    </div>
    <div class="drop-links"><button class="link-arrow small" type="button" data-demo>Try the live demo</button><span aria-hidden="true">·</span><button class="link-arrow small" type="button" data-pick-folder>Choose an unzipped folder</button></div>
    <input class="drop-file" type="file" multiple accept=".zip,.json,.html,.htm,.js,.txt,.csv,application/zip" tabindex="-1" aria-hidden="true">
    <input class="drop-file" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
  </div>
</div>
</div>
<div class="trust-row fade-in" style="--d:.7s">
  <span><svg aria-hidden="true"><use href="#i-shield"/></svg>0 bytes uploaded</span>
  <span><svg aria-hidden="true"><use href="#i-plane"/></svg>Works in airplane mode</span>
  <span><svg aria-hidden="true"><use href="#i-key"/></svg>Never asks for your password</span>
  <span><svg aria-hidden="true"><use href="#i-bolt"/></svg>100,000 followers in under 2 seconds</span>
</div>
