name: Daily improvement

# Twice a day Claude does the next item of AUTOPILOT.md (copy, guides, blog posts in 6 languages), then this
# workflow checks the change itself before it goes live:
#   - only allowed paths changed (no worker code, payments, licenses, workflows or dependencies),
#   - npm test (incl. i18n parity) and the full build pass.
# If all is well it commits to main, deploys the Worker (wrangler) + IndexNow and tells the owner on Telegram;
# otherwise nothing is published and the owner is told.
#
# Uses the owner's SECOND Claude account through CLAUDE_CODE_OAUTH_TOKEN (no API bill), Sonnet with a turn cap.
# 2026-10-26 portfolio focus: the first Claude account is kept for AgedSocials. 06:00 in Iran (UTC+3:30).
# Deploy needs secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") + variable CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    # 2026-10-27: owner no longer uses the second Claude account itself, so this runs twice a day to use its limit.
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

concurrency:
  group: improve
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUMMARY: /tmp/uw-summary.txt
    steps:
      - id: token
        run: echo "set=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Health check (free)
        id: health
        run: |
          bad=""
          for u in https://myunwrapped.com/ https://myunwrapped.com/pricing/ https://myunwrapped.com/api/config; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo 000)
            [ "$code" = 200 ] || bad="$bad $u=$code"
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.set == 'true'
        run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.set == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model sonnet --max-turns 25
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(npm run build),Bash(git diff:*),Bash(git status)"
          prompt: |
            You improve the Unwrapped website (myunwrapped.com, privacy-first social media export analyzer);
            the working directory is its repository. Read AUTOPILOT.md first: it has the rules and the Backlog.
            Do the first unchecked Backlog item only, following the rules, run `npm test && npm run build` once
            at the end, then tick the item in AUTOPILOT.md (`- [x] (YYYY-MM-DD) ...`, today's date).
            Do not commit, push or open pull requests.
            Finally write a one-line summary in simple Persian for the owner to /tmp/uw-summary.txt.

      - name: Check and publish
        id: publish
        if: steps.token.outputs.set == 'true'
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then echo "result=nothing" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(\.github/|src/|server/|scripts/|test/|wrangler\.jsonc$|package(-lock)?\.json$|site/pages/admin)' \
             || echo "$changed" | grep -qiE '^public/assets/js/.*(checkout|license|pay|admin|account|auth)'; then
            echo "result=forbidden" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! (npm test && npm run build); then echo "result=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          item=$(git diff --cached AUTOPILOT.md | grep -m1 '^+- \[x\]' | cut -c8- | cut -c1-120)
          git commit -m "Daily improvement: ${item:-roadmap item}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "result=published" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.publish.outputs.result == 'published'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "status=nokey" >> "$GITHUB_OUTPUT"; exit 0; fi
          if npm run deploy; then echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "status=failed" >> "$GITHUB_OUTPUT"; fi

      - name: Tell the owner on Telegram
        if: always()
        env:
          RESULT: ${{ steps.publish.outputs.result }}
          DEPLOY: ${{ steps.deploy.outputs.status }}
          TOKEN_SET: ${{ steps.token.outputs.set }}
          BAD: ${{ steps.health.outputs.bad }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          summary=$(head -c 600 "$SUMMARY" 2>/dev/null || true)
          case "$RESULT" in
            published) text="📊 Unwrapped — بهبود امروز:
          ${summary}"
               case "$DEPLOY" in
                 ok) ;;
                 nokey) text="$text
          (کد ذخیره شد ولی روی سایت نرفت: کلید Cloudflare در GitHub تنظیم نشده)" ;;
                 *) text="$text
          ⚠️ انتشار روی سایت خطا داد. $RUN_URL" ;;
               esac ;;
            nothing) text="ℹ️ Unwrapped — امروز تغییری لازم نبود." ;;
            forbidden) text="⛔️ Unwrapped — تغییر امروز به بخش‌های حساس دست زده بود و منتشر نشد. $RUN_URL" ;;
            failed) text="⚠️ Unwrapped — تغییر امروز تست‌ها را رد کرد و منتشر نشد. $RUN_URL" ;;
            *) if [ "$TOKEN_SET" != "true" ]; then text=""; else
               text="⚠️ Unwrapped — بهبود خودکار امروز اجرا نشد (شاید سهمیه‌ی Claude تمام شده بود). $RUN_URL"; fi ;;
          esac
          [ -n "$BAD" ] && text="🔴 Unwrapped — سایت جواب نمی‌دهد:$BAD
          $text"
          [ -n "$text" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
