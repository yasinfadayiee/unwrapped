<div class="fade-in" style="--d:.5s">
<div class="drop" id="start">
  <div class="drop-inner" data-drop aria-label="Deinen Datenexport analysieren">
    <div class="drop-icon"><svg aria-hidden="true"><use href="#i-package"/></svg></div>
    <div class="drop-title">Lege deine Export-ZIP hier ab</div>
    <p class="drop-hint">Sie wird auf diesem Gerät gelesen — nichts wird hochgeladen.</p>
    <div class="drop-actions">
      <button class="btn btn--primary btn--lg" type="button" data-pick><svg aria-hidden="true"><use href="#i-upload"/></svg>Meinen Export wählen</button>
      <a class="btn btn--ghost btn--lg" href="#how"><svg aria-hidden="true"><use href="#i-download"/></svg>Ich habe ihn noch nicht</a>
    </div>
    <div class="drop-platforms" aria-label="Unterstützte Plattformen">
      <span class="pf"><img class="ico3d" src="/assets/img/icons/instagram.webp" width="64" height="64" alt="" decoding="async">Instagram</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/tiktok.webp" width="64" height="64" alt="" decoding="async">TikTok</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/x.webp" width="64" height="64" alt="" decoding="async">X</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/facebook.webp" width="64" height="64" alt="" decoding="async">Facebook</span>
      <span class="pf"><svg aria-hidden="true"><use href="#i-threads"/></svg>Threads</span>
      <span class="pf"><img class="ico3d" src="/assets/img/icons/linkedin.webp" width="64" height="64" alt="" decoding="async">LinkedIn</span>
    </div>
    <div class="drop-links"><button class="link-arrow small" type="button" data-demo>Live-Demo ausprobieren</button><span aria-hidden="true">·</span><button class="link-arrow small" type="button" data-pick-folder>Entpackten Ordner wählen</button></div>
    <input class="drop-file" type="file" multiple accept=".zip,.json,.html,.htm,.js,.txt,.csv,application/zip" tabindex="-1" aria-hidden="true">
    <input class="drop-file" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
  </div>
</div>
</div>
<div class="trust-row fade-in" style="--d:.7s">
  <span><svg aria-hidden="true"><use href="#i-shield"/></svg>0 Bytes hochgeladen</span>
  <span><svg aria-hidden="true"><use href="#i-plane"/></svg>Funktioniert im Flugmodus</span>
  <span><svg aria-hidden="true"><use href="#i-key"/></svg>Fragt nie nach deinem Passwort</span>
  <span><svg aria-hidden="true"><use href="#i-bolt"/></svg>100.000 Follower in unter 2 Sekunden</span>
</div>
